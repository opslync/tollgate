name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...

  # The spend-accounting correctness suite: restarts, concurrency, cancellation,
  # malformed upstream responses, and attribution. Run as its own job so a
  # failure reads as "the money numbers are wrong", not "a test broke".
  # See docs/correctness.md for the invariant table these prove.
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race -run Correctness ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/tollgate
      - run: helm template ci deploy/helm/tollgate > /dev/null
      - run: helm template ci deploy/helm/tollgate --set persistence.enabled=true --set existingSecret=keys > /dev/null
      - run: helm template ci deploy/helm/tollgate --set config.kubernetes.enabled=true --set serviceAccount.create=true --set rbac.create=true > /dev/null
      - run: helm template ci deploy/helm/tollgate --set serviceMonitor.enabled=true > /dev/null
